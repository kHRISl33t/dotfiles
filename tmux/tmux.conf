# OSX - .tmux.conf

# plugins (https://github.com/tmux-plugins/tpm)
# hit 'C-b I' to fetch plugins and source them
# hit 'C-b U' to update plugins and source them
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'

# autosave sessions every 15 minutes and restore them when tmux starts.
# resurrect prunes its saves after 30 days on its own.
set -g @continuum-restore 'on'

# terminal capabilities. RGB is truecolor, usstyle is undercurl.
# the Ss/Se override is what makes cursor shape changes work.
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:usstyle'
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set-environment -g COLORTERM "truecolor"

set -g history-limit 20000

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# mouse scrolling in pane
set -g mouse on

# count windows and panes from 1 so the numbers match the keys you press,
# and close the numbering gap when a window is killed
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# split panes using | and -, and open new panes/windows in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# reload this file. the message confirms it actually happened
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# resize panes with prefix then shift-HJKL, held to repeat.
# the tmux defaults for this are C-arrow and M-arrow, but macOS Mission Control
# takes Ctrl+Left/Right for switching spaces so they never reach tmux.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# switch panes using Alt-arrow without prefix
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

# set -g default-shell /bin/zsh
set -g set-titles on
set -g set-titles-string 'tmux: #T'
# 100 was too short for repeatable bindings: the resize keys stopped repeating
# before you could press them again
set -g repeat-time 500
setw -g clock-mode-style 12
setw -g alternate-screen on

setw -g mode-keys vi

# loud or quiet?
set-option -g visual-bell on
set-option -g visual-silence off
set-window-option -g monitor-activity off
# 'other' flags the window in the status bar when a bell fires in a window you
# are not currently viewing. The Claude Code and Codex hooks ring this bell.
set-option -g bell-action other

# Initialize TMUX plugin manager
# (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
